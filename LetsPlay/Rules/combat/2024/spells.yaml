# PHB 2024 spells used so far in TalkDND, plus SRD 5.2.1 spatial overlays for
# the AoE shapes that the 2024 upstream JSON does not structure. Spellcasting
# numbers come from the caster's `spellcasting` block ({spell_attack}, {spell_dc},
# {spell_mod}).
# TASK-0127 (v1.6 T5): every spell carries a structured `spell` block. Numbers are
# transcribed from SRD 5.2.1 / PHB 2024 text (tracked via the 5.2.1 pack manuals
# and the 5e-database 2024 JSON); class lists mirror the bundled talkdnd
# class data (5e-database 2024 spells[].classes).
# Upcast that is not a main-damage/heal dice table (extra darts/targets) and the
# persistent areas (moonbeam, spirit guardians) stay manual (D-6).
abilities:
  - id: fire-bolt
    name: Fire Bolt
    tags: [spell, cantrip]
    activation: action
    range: 120
    target: {type: creature, side: enemy, count: 1}
    effects:
      - attack: {to_hit: "{spell_attack}", kind: ranged, damage: [{dice: "1d10", type: fire}]}
    ai: {role: damage}
    source: "PHB 2024 Fire Bolt"
    spell:
      level: 0
      school: evocation
      casting_time: {amount: 1, unit: action}
      components: {verbal: true, somatic: true}
      ritual: false
      classes: [sorcerer, wizard]
      range_text: "120 feet"
      duration_text: Instantaneous
      cantrip_scaling:
        text: "Cantrip Upgrade: The damage increases by 1d10 when you reach levels 5 (2d10), 11 (3d10), and 17 (4d10)."
        dice_by_character_level: {5: "2d10", 11: "3d10", 17: "4d10"}
  - id: shocking-grasp
    name: Shocking Grasp
    tags: [spell, cantrip]
    activation: action
    range: 5
    target: {type: creature, side: enemy, count: 1}
    effects:
      - attack:
          to_hit: "{spell_attack}"
          kind: melee
          damage: [{dice: "1d8", type: lightning}]
          on_hit: [{apply_condition: {condition: no-opportunity-attacks, to: target, duration: {until: end_of_target_next_turn}}}]
    ai: {role: damage}
    source: "PHB 2024: target can't make Opportunity Attacks until the start of its next turn"
    todo: ["Duration approximated as end of target's next turn (rule: start of its next turn)"]
    spell:
      level: 0
      school: evocation
      casting_time: {amount: 1, unit: action}
      components: {verbal: true, somatic: true}
      ritual: false
      classes: [sorcerer, wizard]
      range_text: Touch
      duration_text: Instantaneous
      cantrip_scaling:
        text: "Cantrip Upgrade: The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8)."
        dice_by_character_level: {5: "2d8", 11: "3d8", 17: "4d8"}
  - id: sacred-flame
    name: Sacred Flame
    tags: [spell, cantrip]
    activation: action
    range: 60
    target: {type: creature, side: enemy, count: 1}
    effects:
      - save: {ability: dex, dc: "{spell_dc}", ignore_cover: true, on_fail: [{damage: {dice: "1d8", type: radiant}}]}
    ai: {role: damage}
    source: "PHB 2024: no benefit from Half or Three-Quarters Cover"
    spell:
      level: 0
      school: evocation
      casting_time: {amount: 1, unit: action}
      components: {verbal: true, somatic: true}
      ritual: false
      classes: [cleric]
      range_text: "60 feet"
      duration_text: Instantaneous
      cantrip_scaling:
        text: "Cantrip Upgrade: The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8)."
        dice_by_character_level: {5: "2d8", 11: "3d8", 17: "4d8"}
  - id: magic-missile
    name: Magic Missile
    tags: [spell, magic-missile]
    activation: action
    cost: {resource: spell-slot-1, amount: 1}
    slot_level: 1
    range: 120
    target: {type: creature, side: enemy, count: 1}
    effects:
      - damage: {dice: "1d4+1", type: force, repeat: 3}
    ai: {role: damage}
    source: "PHB 2024: three darts, 1d4+1 force each, automatically hit (all darts on one target here)"
    todo: ["Upcast creates one more dart per slot level above 1; dart count is not a dice table, so higher slots keep base effects (UPCAST NOT MODELED)"]
    spell:
      level: 1
      school: evocation
      casting_time: {amount: 1, unit: action}
      components: {verbal: true, somatic: true}
      ritual: false
      classes: [sorcerer, wizard]
      range_text: "120 feet"
      duration_text: Instantaneous
  - id: shield
    name: Shield
    tags: [spell]
    activation: reaction
    cost: {resource: spell-slot-1, amount: 1}
    slot_level: 1
    range: 0
    target: {type: self}
    triggers:
      - on: on_hit_taken
        reaction: true
        when: {would_miss_with_ac_bonus: 5}
        effects: [{apply_condition: {condition: shielded, to: self, duration: {until: start_of_source_next_turn}}}]
    ai: {role: defense}
    source: "PHB 2024: +5 AC until start of your next turn incl. triggering attack; no damage from Magic Missile"
    spell:
      level: 1
      school: abjuration
      casting_time: {amount: 1, unit: reaction}
      components: {verbal: true, somatic: true}
      ritual: false
      classes: [sorcerer, wizard]
      range_text: Self
      duration_text: "1 round"
  - id: cure-wounds
    name: Cure Wounds
    tags: [spell, heal]
    activation: action
    cost: {resource: spell-slot-1, amount: 1}
    slot_level: 1
    range: 5
    target: {type: creature, side: ally, count: 1}
    effects:
      - heal: {dice: "2d8+{spell_mod}"}
    ai: {role: heal}
    source: "PHB 2024: 2d8 + spellcasting modifier (abjuration)"
    spell:
      level: 1
      school: abjuration
      casting_time: {amount: 1, unit: action}
      components: {verbal: true, somatic: true}
      ritual: false
      classes: [bard, cleric, druid, paladin, ranger]
      range_text: Touch
      duration_text: Instantaneous
      upcast:
        text: "Using a Higher-Level Spell Slot: The healing increases by 2d8 for each spell slot level above 1."
        dice_by_level:
          2: "4d8+{spell_mod}"
          3: "6d8+{spell_mod}"
          4: "8d8+{spell_mod}"
          5: "10d8+{spell_mod}"
          6: "12d8+{spell_mod}"
          7: "14d8+{spell_mod}"
          8: "16d8+{spell_mod}"
          9: "18d8+{spell_mod}"
  - id: bless
    name: Bless
    tags: [spell]
    activation: action
    cost: {resource: spell-slot-1, amount: 1}
    slot_level: 1
    range: 30
    target: {type: creature, side: ally, count: 3}
    concentration: true
    effects:
      - apply_condition: {condition: blessed, to: target, duration: {minutes: 1}}
    ai: {role: buff}
    source: "PHB 2024: up to three creatures add 1d4 to attack rolls and saves; concentration 1 minute"
    todo: ["Upcast targets one additional creature per slot level above 1; not a dice table, higher slots keep three targets"]
    spell:
      level: 1
      school: enchantment
      casting_time: {amount: 1, unit: action}
      components:
        verbal: true
        somatic: true
        material: {text: "a Holy Symbol worth 5+ GP", cost_gp: 5}
      ritual: false
      classes: [cleric, paladin]
      range_text: "30 feet"
      duration_text: "Up to 1 minute"
  - id: sanctuary
    name: Sanctuary
    tags: [spell]
    activation: bonus
    cost: {resource: spell-slot-1, amount: 1}
    slot_level: 1
    range: 30
    target: {type: creature, side: ally, count: 1}
    effects:
      - apply_condition: {condition: sanctuary-warded, to: target, duration: {minutes: 1}}
    ai: {role: defense}
    manual: "Attackers must pass a WIS save vs caster DC or pick a new target; AI enemies avoid warded targets via avoid_targets_with."
    source: "PHB 2024 Sanctuary"
    spell:
      level: 1
      school: abjuration
      casting_time: {amount: 1, unit: bonus_action}
      components:
        verbal: true
        somatic: true
        material: {text: "a shard of glass from a mirror"}
      ritual: false
      classes: [cleric]
      range_text: "30 feet"
      duration_text: "1 minute"
  - id: sleep
    name: Sleep
    tags: [spell]
    activation: action
    cost: {resource: spell-slot-1, amount: 1}
    slot_level: 1
    range: 60
    target: {type: zone, side: enemy}
    area: {radius: 5}
    concentration: true
    effects:
      - save:
          ability: wis
          dc: "{spell_dc}"
          on_fail:
            - apply_condition: {condition: incapacitated, to: target, duration: {until: end_of_target_next_turn}, ends_on: [damage_taken]}
            - note: "Sleep: at the end of its next turn the target repeats the WIS save; on a failure it is Unconscious for the duration (ends if it takes damage or someone uses an action to shake it)."
    ai: {role: control}
    source: "PHB 2024 Sleep: 5-ft-radius sphere, WIS save or Incapacitated until end of next turn, then repeat save or Unconscious"
    todo: ["Second save -> unconscious is manual (needs chained save_ends→condition)", "Creatures that don't sleep or have Exhaustion immunity auto-pass; not expressible, DM rules it"]
    spell:
      level: 1
      school: enchantment
      casting_time: {amount: 1, unit: action}
      components:
        verbal: true
        somatic: true
        material: {text: "a pinch of sand or rose petals"}
      ritual: false
      classes: [bard, sorcerer, wizard]
      range_text: "60 feet"
      duration_text: "Up to 1 minute"
  - id: detect-magic
    name: Detect Magic
    tags: [spell, ritual]
    activation: action
    cost: {resource: spell-slot-1, amount: 1}
    slot_level: 1
    concentration: true
    target: {type: self}
    effects: [{note: "Detect Magic: sense magic within 30 ft for up to 10 minutes (concentration)."}]
    ai: {role: none}
    spell:
      level: 1
      school: divination
      casting_time: {amount: 1, unit: action}
      components: {verbal: true, somatic: true}
      ritual: true
      classes: [bard, cleric, druid, paladin, ranger, sorcerer, warlock, wizard]
      range_text: Self
      duration_text: "Up to 10 minutes"
  - id: mage-hand
    name: Mage Hand
    tags: [spell, cantrip]
    activation: action
    target: {type: self}
    effects: [{note: "Mage Hand: spectral hand within 30 ft manipulates objects (no attacks)."}]
    ai: {role: none}
    spell:
      level: 0
      school: conjuration
      casting_time: {amount: 1, unit: action}
      components: {verbal: true, somatic: true}
      ritual: false
      classes: [bard, sorcerer, warlock, wizard]
      range_text: "30 feet"
      duration_text: "1 minute"
  - id: minor-illusion
    name: Minor Illusion
    tags: [spell, cantrip]
    activation: action
    target: {type: self}
    effects: [{note: "Minor Illusion: sound or image; Investigation vs spell DC to discern."}]
    ai: {role: none}
    spell:
      level: 0
      school: illusion
      casting_time: {amount: 1, unit: action}
      components:
        verbal: false
        somatic: true
        material: {text: "a bit of fleece"}
      ritual: false
      classes: [bard, sorcerer, warlock, wizard]
      range_text: "30 feet"
      duration_text: "1 minute"
  # SRD 5.2.1 AoE shape overlays. The upstream 2024 JSON has no
  # area_of_effect; these shapes come from the SRD spell text.
  # TASK-0127: the four one-shot saves are structured (save + half damage,
  # thunderwave also pushes on a failure); moonbeam and spirit guardians stay
  # note+manual because their areas persist and re-save (no effect type yet).
  - id: "burning-hands"
    activation: "action"
    ai:
      role: "none"
    area:
      radius: 15
      shape: "cone"
    cost:
      amount: 1
      resource: "spell-slot-1"
    effects:
      -
        save:
          ability: "dex"
          dc: "{spell_dc}"
          half: true
          on_fail:
            -
              damage:
                dice: "3d6"
                type: "fire"
    manual: |-
      action; Self ; V, S; Instantaneous.

      A thin sheet of flames shoots forth from you. Each creature in a 15-foot Cone makes a Dexterity saving throw, taking 3d6 Fire damage on a failed save or half as much damage on a successful one.
        Flammable objects in the Cone that aren't being worn or carried start burning.

      At higher levels: The damage increases by 1d6 for each spell slot level above 1.
    name: "Burning Hands"
    range: 0
    slot_level: 1
    source: "SRD 5.2.1 Burning Hands"
    tags:
      - "spell"
      - "srd"
      - "evocation"
    target:
      type: "self"
    spell:
      level: 1
      school: evocation
      casting_time: {amount: 1, unit: action}
      components: {verbal: true, somatic: true}
      ritual: false
      classes: [sorcerer, wizard]
      range_text: Self
      duration_text: Instantaneous
      upcast:
        text: "At higher levels: The damage increases by 1d6 for each spell slot level above 1."
        dice_by_level:
          2: "4d6"
          3: "5d6"
          4: "6d6"
          5: "7d6"
          6: "8d6"
          7: "9d6"
          8: "10d6"
          9: "11d6"
  - id: "fireball"
    activation: "action"
    ai:
      role: "none"
    area:
      radius: 20
      shape: "sphere"
    cost:
      amount: 1
      resource: "spell-slot-3"
    effects:
      -
        save:
          ability: "dex"
          dc: "{spell_dc}"
          half: true
          on_fail:
            -
              damage:
                dice: "8d6"
                type: "fire"
    manual: |-
      action; 150 feet ; V, S, M; Instantaneous.

      A bright streak flashes from you to a point you choose within range and then blossoms with a low roar into a fiery explosion. Each creature in a 20-foot-radius Sphere centered on that point makes a Dexterity saving throw, taking 8d6 Fire damage on a failed save or half as much damage on a successful one.
        Flammable objects in the area that aren't being worn or carried start burning.

      At higher levels: The damage increases by 1d6 for each spell slot level above 3.
    name: "Fireball"
    range: 150
    slot_level: 3
    source: "SRD 5.2.1 Fireball"
    tags:
      - "spell"
      - "srd"
      - "evocation"
    target:
      type: "self"
    spell:
      level: 3
      school: evocation
      casting_time: {amount: 1, unit: action}
      components:
        verbal: true
        somatic: true
        material: {text: "a ball of bat guano and sulfur"}
      ritual: false
      classes: [sorcerer, wizard]
      range_text: "150 feet"
      duration_text: Instantaneous
      upcast:
        text: "At higher levels: The damage increases by 1d6 for each spell slot level above 3."
        dice_by_level:
          4: "9d6"
          5: "10d6"
          6: "11d6"
          7: "12d6"
          8: "13d6"
          9: "14d6"
  - id: "lightning-bolt"
    activation: "action"
    ai:
      role: "none"
    area:
      radius: 100
      shape: "line"
      width_ft: 5
    cost:
      amount: 1
      resource: "spell-slot-3"
    effects:
      -
        save:
          ability: "dex"
          dc: "{spell_dc}"
          half: true
          on_fail:
            -
              damage:
                dice: "8d6"
                type: "lightning"
    manual: |-
      action; Self ; V, S, M; Instantaneous.

      A stroke of lightning forming a 100-foot-long, 5-foot-wide Line blasts out from you in a direction you choose. Each creature in the Line makes a Dexterity saving throw, taking 8d6 Lightning damage on a failed save or half as much damage on a successful one.

      At higher levels: The damage increases by 1d6 for each spell slot level above 3.
    name: "Lightning Bolt"
    range: 0
    slot_level: 3
    source: "SRD 5.2.1 Lightning Bolt"
    tags:
      - "spell"
      - "srd"
      - "evocation"
    target:
      type: "self"
    spell:
      level: 3
      school: evocation
      casting_time: {amount: 1, unit: action}
      components:
        verbal: true
        somatic: true
        material: {text: "a bit of fur and a crystal rod"}
      ritual: false
      classes: [sorcerer, wizard]
      range_text: Self
      duration_text: Instantaneous
      upcast:
        text: "At higher levels: The damage increases by 1d6 for each spell slot level above 3."
        dice_by_level:
          4: "9d6"
          5: "10d6"
          6: "11d6"
          7: "12d6"
          8: "13d6"
          9: "14d6"
  - id: "moonbeam"
    activation: "action"
    ai:
      role: "none"
    area:
      radius: 5
      shape: "cylinder"
    concentration: true
    cost:
      amount: 1
      resource: "spell-slot-2"
    effects:
      -
        note: "Moonbeam (SRD 5.2.1, manual): see `manual`."
    manual: |-
      action; 120 feet ; V, S, M; up to 1 minute.

       A silvery beam of pale light shines down in a 5-foot-radius, 40-foot-high Cylinder centered on a point within range. Until the spell ends, Dim Light fills the Cylinder, and you can take a Magic action on later turns to move the Cylinder up to 60 feet.
        When the Cylinder appears, each creature in it makes a Constitution saving throw. On a failed save, a creature takes 2d10 Radiant damage, and if the creature is shape-shifted (as a result of the Polymorph spell, for example), it reverts to its true form and can't shape-shift until it leaves the Cylinder. On a successful save, a creature takes half as much damage only. A creature also makes this save when the spell's area moves into its space and when it enters the spell's area or ends its turn there. A creature makes this save only once per turn.

      At higher levels: The damage increases by 1d10 for each spell slot level above 2.
    name: "Moonbeam"
    range: 120
    slot_level: 2
    source: "SRD 5.2.1 Moonbeam"
    tags:
      - "spell"
      - "srd"
      - "evocation"
    target:
      type: "self"
    todo: ["Persistent area: initial and recurring CON saves are manual; upcast (+1d10 per slot above 2) has no structured main effect, so no dice table (higher slots keep base effects)"]
    spell:
      level: 2
      school: evocation
      casting_time: {amount: 1, unit: action}
      components:
        verbal: true
        somatic: true
        material: {text: "a moonseed leaf"}
      ritual: false
      classes: [druid]
      range_text: "120 feet"
      duration_text: "Up to 1 minute"
  - id: "spirit-guardians"
    activation: "action"
    ai:
      role: "none"
    area:
      radius: 15
      shape: "emanation"
    concentration: true
    cost:
      amount: 1
      resource: "spell-slot-3"
    effects:
      -
        note: "Spirit Guardians (SRD 5.2.1, manual): see `manual`."
    manual: |-
      action; Self ; V, S, M; up to 10 minutes.

      Protective spirits flit around you in a 15-foot Emanation for the duration. If you are good or neutral, their spectral form appears angelic or fey (your choice). If you are evil, they appear fiendish.
        When you cast this spell, you can designate creatures to be unaffected by it. Any other creature's Speed is halved in the Emanation, and whenever the Emanation enters a creature's space and whenever a creature enters the Emanation or ends its turn there, the creature must make a Wisdom saving throw. On a failed save, the creature takes 3d8 Radiant damage (if you are good or neutral) or 3d8 Necrotic damage (if you are evil). On a successful save, the creature takes half as much damage. A creature makes this save only once per turn.

      At higher levels: The damage increases by 1d8 for each spell slot level above 3.
    name: "Spirit Guardians"
    range: 0
    slot_level: 3
    source: "SRD 5.2.1 Spirit Guardians"
    tags:
      - "spell"
      - "srd"
      - "conjuration"
    target:
      type: "self"
    todo: ["Persistent area: recurring WIS saves are manual; upcast (+1d8 per slot above 3) has no structured main effect, so no dice table (higher slots keep base effects)"]
    spell:
      level: 3
      school: conjuration
      casting_time: {amount: 1, unit: action}
      components:
        verbal: true
        somatic: true
        material: {text: "a prayer scroll"}
      ritual: false
      classes: [cleric]
      range_text: Self
      duration_text: "Up to 10 minutes"
  - id: "thunderwave"
    activation: "action"
    ai:
      role: "none"
    area:
      radius: 15
      shape: "cube"
    cost:
      amount: 1
      resource: "spell-slot-1"
    effects:
      -
        save:
          ability: "con"
          dc: "{spell_dc}"
          half: true
          on_fail:
            -
              damage:
                dice: "2d8"
                type: "thunder"
            -
              forced_move:
                distance: 10
                direction: "away"
    manual: |-
      action; Self ; V, S; Instantaneous.

      You unleash a wave of thunderous energy. Each creature in a 15-foot Cube originating from you makes a Constitution saving throw. On a failed save, a creature takes 2d8 Thunder damage and is pushed 10 feet away from you. On a successful save, a creature takes half as much damage only.
        In addition, unsecured objects that are entirely within the Cube are pushed 10 feet away from you, and a thunderous boom is audible within 300 feet.   Using a Higher-Level Spell Slot. The damage increases by 1d8 for each spell slot level above 1.
    name: "Thunderwave"
    range: 0
    slot_level: 1
    source: "SRD 5.2.1 Thunderwave"
    tags:
      - "spell"
      - "srd"
      - "evocation"
    target:
      type: "self"
    spell:
      level: 1
      school: evocation
      casting_time: {amount: 1, unit: action}
      components: {verbal: true, somatic: true}
      ritual: false
      classes: [bard, druid, sorcerer, wizard]
      range_text: Self
      duration_text: Instantaneous
      upcast:
        text: "Using a Higher-Level Spell Slot: The damage increases by 1d8 for each spell slot level above 1."
        dice_by_level:
          2: "3d8"
          3: "4d8"
          4: "5d8"
          5: "6d8"
          6: "7d8"
          7: "8d8"
          8: "9d8"
          9: "10d8"
