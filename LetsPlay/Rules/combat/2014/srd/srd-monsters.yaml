    id: aboleth-multiattack
    manual: The aboleth makes three tentacle attacks.
    name: Multiattack
  - activation: action
    id: aboleth-tentacle
    manual: 'Melee Weapon Attack: +9 to hit, reach 10 ft., one target. Hit: 12 (2d6 + 5) bludgeoning damage. If the target is a creature, it must succeed on a DC 14 Constitution saving throw or become diseased. The disease has no effect for 1 minute and can be removed by any magic that cures disease. After 1 minute, the diseased creature''s skin becomes translucent and slimy, the creature can''t regain hit points unless it is underwater, and the disease can be removed only by heal or another disease-curing spell of 6th level or higher. When the creature is outside a body of water, it takes 6 (1d12) acid damage every 10 minutes unless moisture is applied to the skin before 10 minutes have passed.'
    name: Tentacle
  - activation: action
    id: aboleth-enslave
    manual: |-
      The aboleth targets one creature it can see within 30 ft. of it. The target must succeed on a DC 14 Wisdom saving throw or be magically charmed by the aboleth until the aboleth dies or until it is on a different plane of existence from the target. The charmed target is under the aboleth's control and can't take reactions, and the aboleth and the target can communicate telepathically with each other over any distance.
      Whenever the charmed target takes damage, the target can repeat the saving throw. On a success, the effect ends. No more than once every 24 hours, the target can also repeat the saving throw when it is at least 1 mile away from the aboleth.
    name: Enslave
  - activation: passive
    id: aboleth-amphibious
    manual: The aboleth can breathe air and water.
    name: Amphibious
  - activation: passive
    id: aboleth-mucous-cloud
    manual: While underwater, the aboleth is surrounded by transformative mucus. A creature that touches the aboleth or that hits it with a melee attack while within 5 ft. of it must make a DC 14 Constitution saving throw. On a failure, the creature is diseased for 1d4 hours. The diseased creature can breathe only underwater.
    name: Mucous Cloud
  - activation: passive
    id: aboleth-probing-telepathy
    manual: If a creature communicates telepathically with the aboleth, the aboleth learns the creature's greatest desires if the aboleth can see the creature.
    name: Probing Telepathy
  - activation: free
    id: aboleth-legendary-detect
    manual: The aboleth makes a Wisdom (Perception) check.
    name: 'Legendary: Detect'
  - activation: free
    id: aboleth-legendary-tail-swipe
    manual: The aboleth makes one tail attack.
    name: 'Legendary: Tail Swipe'
  - activation: free
    id: aboleth-legendary-psychic-drain-costs-2-actions
    manual: One creature charmed by the aboleth takes 10 (3d6) psychic damage, and the aboleth regains hit points equal to the damage the creature takes.
    name: 'Legendary: Psychic Drain (Costs 2 Actions)'
