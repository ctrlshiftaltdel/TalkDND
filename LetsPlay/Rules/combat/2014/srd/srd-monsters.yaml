  features:
  - activation: action
    id: tarrasque-multiattack
    manual: 'The tarrasque can use its Frightful Presence. It then makes five attacks: one with its bite, two with its claws, one with its horns, and one with its tail. It can use its Swallow instead of its bite.'
    name: Multiattack
  - activation: action
    id: tarrasque-frightful-presence
    manual: Each creature of the tarrasque's choice within 120 feet of it and aware of it must succeed on a DC 17 Wisdom saving throw or become frightened for 1 minute. A creature can repeat the saving throw at the end of each of its turns, with disadvantage if the tarrasque is within line of sight, ending the effect on itself on a success. If a creature's saving throw is successful or the effect ends for it, the creature is immune to the tarrasque's Frightful Presence for the next 24 hours.
    name: Frightful Presence
  - activation: action
    id: tarrasque-swallow
    manual: |-
      The tarrasque makes one bite attack against a Large or smaller creature it is grappling. If the attack hits, the target takes the bite's damage, the target is swallowed, and the grapple ends. While swallowed, the creature is blinded and restrained, it has total cover against attacks and other effects outside the tarrasque, and it takes 56 (16d6) acid damage at the start of each of the tarrasque's turns.
      If the tarrasque takes 60 damage or more on a single turn from a creature inside it, the tarrasque must succeed on a DC 20 Constitution saving throw at the end of that turn or regurgitate all swallowed creatures, which fall prone in a space within 10 feet of the tarrasque. If the tarrasque dies, a swallowed creature is no longer restrained by it and can escape from the corpse by using 30 feet of movement, exiting prone.
    name: Swallow
  - activation: passive
    id: tarrasque-legendary-resistance
    manual: If the tarrasque fails a saving throw, it can choose to succeed instead.
    name: Legendary Resistance
  - activation: passive
    id: tarrasque-magic-resistance
    manual: The tarrasque has advantage on saving throws against spells and other magical effects.
    name: Magic Resistance
  - activation: passive
    id: tarrasque-reflective-carapace
    manual: Any time the tarrasque is targeted by a magic missile spell, a line spell, or a spell that requires a ranged attack roll, roll a d6. On a 1 to 5, the tarrasque is unaffected. On a 6, the tarrasque is unaffected, and the effect is reflected back at the caster as though it originated from the tarrasque, turning the caster into the target.
    name: Reflective Carapace
  - activation: passive
    id: tarrasque-siege-monster
    manual: The tarrasque deals double damage to objects and structures.
    name: Siege Monster
  - activation: free
    id: tarrasque-legendary-attack
    manual: The tarrasque makes one claw attack or tail attack.
    name: 'Legendary: Attack'
  - activation: free
    id: tarrasque-legendary-move
    manual: The tarrasque moves up to half its speed.
    name: 'Legendary: Move'
  - activation: free
    id: tarrasque-legendary-chomp-costs-2-actions
    manual: The tarrasque makes one bite attack or uses its Swallow.
    name: 'Legendary: Chomp (Costs 2 Actions)'
