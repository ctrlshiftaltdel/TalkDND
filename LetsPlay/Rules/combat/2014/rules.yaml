# 2014 (SRD 5.1): surprised creatures roll initiative normally but can't move or
# act on their first turn (and no reactions until it ends).
rules:
  surprise: {initiative_disadvantage: false, condition: surprised}
  # 2014 (SRD 5.1): ritual casting is a class feature (Bard = known,
  # Cleric/Druid = prepared, Wizard = book; the class pack carries
  # classes.<id>.ritual). Warlock rituals via invocations are out of scope.
  spellcasting: {ritual: per-class}
  combat_actions:
    unarmed_strike: {damage: "1+{str}"}
    grapple:
      resolution: contest
      attacker_skill: athletics
      defender_skills: [athletics, acrobatics]
    shove:
      resolution: contest
      attacker_skill: athletics
      defender_skills: [athletics, acrobatics]
  exhaustion:
    check_disadvantage_from: 1
    speed_halved_from: 2
    attack_save_disadvantage_from: 3
    hp_max_halved_from: 4
    speed_zero_from: 5
