creatures:
  - id: animated-armor
    name: Animated Armor
    kind: monster
    size: medium
    creature_type: construct
    ac: 18
    hp: 33
    speed: {walk: 25}
    init_bonus: 0
    prof: 2
    abilities: {str: 14, dex: 11, con: 13, int: 1, wis: 3, cha: 1}
    immunities: [poison, psychic]
    condition_immunities: [blinded, charmed, deafened, exhaustion, frightened, paralyzed, petrified, poisoned]
    senses: "Blindsight 60 ft. (blind beyond this radius); Passive Perception 6"
    attacks:
      - {id: slam, name: Slam, kind: melee, ability: str, to_hit: 4, damage: [{dice: "1d6+2", type: bludgeoning}], reach: 5}
    multiattack: [slam, slam]
    features:
      - id: antimagic-susceptibility
        name: Antimagic Susceptibility
        activation: passive
        manual: "Incapacitated in an antimagic field; dispel magic CON save vs caster DC or unconscious 1 minute."
      - id: false-appearance
        name: False Appearance
        activation: passive
        manual: "While motionless, indistinguishable from a normal suit of armor."
    ai: {template: mindless}
    notes: "SRD 5.1 Animated Armor, CR 1 (XP 200), HP 33 (6d8+6). Multiattack: two Slam attacks. 2014 includes Blinded in condition immunities (2024 YAML omitted it)."
