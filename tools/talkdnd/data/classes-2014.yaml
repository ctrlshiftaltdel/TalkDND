      - [1, Spellcasting, 魅力施法，已知法术]
      - [1, Bardic Inspiration, 附赠动作给盟友一颗激励骰，可加到检定、攻击或豁免]
      - [2, Jack of All Trades, 未熟练的属性检定加一半熟练]
