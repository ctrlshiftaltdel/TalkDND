    subclasses:
      land:
        name: Circle of the Land
        features:
          - [2, Bonus Cantrip, 额外一个德鲁伊戏法]
          - [2, Natural Recovery, 短休恢复法术位（总环数 ≤ 等级一半），每长休一次]
          - [3, Circle Spells, 按所选地形获得常备法术]
          - [6, "Land's Stride", 非魔法困难地形不减速]
          - [10, "Nature's Ward", 免疫毒与疾病，对元素与妖精魅惑/恐慌免疫]
          - [14, "Nature's Sanctuary", 野兽与植物攻击你前需感知豁免]
  fighter:
    caster: none
    weapons: [simple, martial]
    asi: [4,6,8,12,14,16,19]
    features:
      - [1, Fighting Style, 选择一种战斗风格]
