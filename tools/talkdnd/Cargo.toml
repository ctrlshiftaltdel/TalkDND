[package]
name = "talkdnd"
version = "0.1.5"
edition = "2021"
description = "TalkDND play helper: start digest, new save, character creation, random companions, checkpoints"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
combat-sim = { path = "../combat-sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"


[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
