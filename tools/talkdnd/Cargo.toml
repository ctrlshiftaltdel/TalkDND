[package]
name = "talkdnd"
version = "1.0.0"
edition = "2021"
description = "TalkDND play helper: start digest, new save, character creation, random companions, checkpoints"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
combat-sim = { path = "../combat-sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg"] }


[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
