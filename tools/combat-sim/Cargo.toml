[package]
name = "combat-sim"
version = "0.3.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_norway = "0.9"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
