[package]
name = "combat-sim"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_norway = "0.9"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
