name: build-artifacts

# Bare release binaries for main. The target list matches release.yml.
# Each artifact's root is the binary itself. Extract it into LetsPlay/bin/.
# talkdnd-dev fetch-binary downloads artifacts combat-sim-<target> and
# talkdnd-<target> and installs them in LetsPlay/bin/ (.exe on Windows).
# Tag packaging and GitHub Releases stay in release.yml.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: macos-15
            target: aarch64-apple-darwin
            ext: ""
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/combat-sim
            tools/talkdnd-dev
            tools/talkdnd

      - name: Build release
        run: |
          cargo build --release --manifest-path tools/combat-sim/Cargo.toml --target ${{ matrix.target }}
          cargo build --release --manifest-path tools/talkdnd/Cargo.toml --target ${{ matrix.target }}

      - name: Upload combat-sim
        uses: actions/upload-artifact@v7
        with:
          name: combat-sim-${{ matrix.target }}
          path: tools/combat-sim/target/${{ matrix.target }}/release/combat-sim${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload talkdnd
        uses: actions/upload-artifact@v7
        with:
          name: talkdnd-${{ matrix.target }}
          path: tools/talkdnd/target/${{ matrix.target }}/release/talkdnd${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 30
