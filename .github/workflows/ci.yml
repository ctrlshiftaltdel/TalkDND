name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Test combat-sim
        run: cargo test --manifest-path tools/combat-sim/Cargo.toml

      - name: Validate AgentOrch kit
        run: python3 scripts/validate_kit.py

      - name: Check tracked files for leaks
        run: bash scripts/check_leaks.sh
