name: release

# Tag pushes (v*) test, package, and publish a GitHub Release.
# workflow_dispatch is a dry build: it uploads Actions artifacts and does not
# create a Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            bin_name: combat-sim
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            bin_name: combat-sim.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            bin_name: combat-sim
    # Artifact upload needs actions: write. contents stays read-only here.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        run: cargo test --manifest-path tools/combat-sim/Cargo.toml --target ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --manifest-path tools/combat-sim/Cargo.toml --target ${{ matrix.target }}

      - name: Package LetsPlay bundle
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          BIN_NAME: ${{ matrix.bin_name }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="dry"
          fi
          case "$tag" in
            ""|*[!A-Za-z0-9._+-]*)
              echo "unsupported package tag" >&2
              exit 1
              ;;
          esac
          bin="tools/combat-sim/target/${TARGET}/release/${BIN_NAME}"
          if [ ! -f "$bin" ]; then
            echo "release binary not found" >&2
            exit 1
          fi
          name="talkdnd-letsplay-${tag}-${TARGET}"
          rm -rf dist
          mkdir -p dist/stage dist/out
          # Only git-tracked files: never copy the working tree.
          git archive --format=tar HEAD LetsPlay | tar -xf - -C dist/stage
          cp NOTICE LICENSE dist/stage/LetsPlay/
          cp "$bin" "dist/stage/LetsPlay/bin/${BIN_NAME}"
          chmod 755 "dist/stage/LetsPlay/bin/${BIN_NAME}"
          # Allowed list = tracked LetsPlay files + NOTICE + LICENSE + binary.
          { git ls-files -- LetsPlay; echo LetsPlay/NOTICE; echo LetsPlay/LICENSE; echo "LetsPlay/bin/${BIN_NAME}"; } \
            | LC_ALL=C sort -u > dist/allowed.txt
          if [ "$ARCHIVE" = "zip" ]; then
            archive="dist/out/${name}.zip"
            (cd dist/stage && 7z a -tzip -bd -r "../out/${name}.zip" LetsPlay >/dev/null)
            7z l -slt "$archive" | sed -n 's/^Path = //p' | tail -n +2 | tr '\\' '/' > dist/raw.txt
            7z l -slt "$archive" | awk '/^Path = /{p=substr($0,8)} /^Folder = -/{print p}' | tr '\\' '/' | LC_ALL=C sort -u > dist/listed.txt
          else
            archive="dist/out/${name}.tar.gz"
            COPYFILE_DISABLE=1 tar -czf "$archive" -C dist/stage LetsPlay
            tar -tzf "$archive" > dist/raw.txt
            grep -v '/$' dist/raw.txt | LC_ALL=C sort -u > dist/listed.txt
          fi
          echo "archive entries: $(wc -l < dist/listed.txt)"
          # Privacy gate: exact match against the allowed list, then deny patterns.
          if ! diff -u dist/allowed.txt dist/listed.txt; then
            echo "archive contents differ from tracked LetsPlay list" >&2
            exit 1
          fi
          if grep -Eiq '\.pdf$|(^|/)dm-secrets\.md$' dist/raw.txt; then
            echo "archive contains a forbidden file" >&2
            exit 1
          fi
          if grep -E '^LetsPlay/Saves/' dist/raw.txt | grep -Ev '^LetsPlay/Saves/(README\.md)?$' | grep -q .; then
            echo "archive contains save content" >&2
            exit 1
          fi
          for d in Rules/2014 Rules/2024 Adventures; do
            if grep -E "^LetsPlay/$d/" dist/raw.txt | grep -Ev "^LetsPlay/$d/(README\.md)?\$" | grep -q .; then
              echo "archive contains player book content" >&2
              exit 1
            fi
          done
          if command -v sha256sum >/dev/null 2>&1; then
            hash=$(sha256sum "$archive" | awk '{print $1}')
          elif command -v shasum >/dev/null 2>&1; then
            hash=$(shasum -a 256 "$archive" | awk '{print $1}')
          else
            hash=$(powershell.exe -NoProfile -Command "(Get-FileHash -Algorithm SHA256 -LiteralPath '$archive').Hash.ToLower()")
          fi
          hash=$(printf '%s' "$hash" | tr -cd '0-9a-fA-F' | tr 'A-F' 'a-f')
          if ! printf '%s' "$hash" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "checksum failed" >&2
            exit 1
          fi
          printf '%s  %s\n' "$hash" "$(basename "$archive")" > "${archive}.sha256"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: talkdnd-letsplay-${{ matrix.target }}
          path: dist/out/
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # contents: write is granted only on this job. actions: read downloads
    # the packages produced above.
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: talkdnd-letsplay-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          body: |
            TalkDND ${{ github.ref_name }}: the play folder `LetsPlay/` with a prebuilt combat-sim.

            - Linux x86_64: `talkdnd-letsplay-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz`
            - Windows x86_64: `talkdnd-letsplay-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip`
            - macOS Apple Silicon: `talkdnd-letsplay-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz`

            Each archive holds the git-tracked `LetsPlay/` tree (DM guide, combat data,
            rulings, README placeholders), `LICENSE`, `NOTICE`, and the binary at
            `LetsPlay/bin/`. No rulebooks, adventures, or saves are included: put your
            own SRD / books into `LetsPlay/Rules/<edition>/` and `LetsPlay/Adventures/`.
            The matching `.sha256` file checksums that archive. macOS Intel builds are
            not published.
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.sha256
        env:
          GITHUB_TOKEN: ${{ github.token }}
