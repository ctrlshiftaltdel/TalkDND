name: release

# Tag pushes (v*) test, package, and publish a GitHub Release.
# workflow_dispatch is a dry build: it uploads Actions artifacts and does not
# create a Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            ext: ""
            platform: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            ext: .exe
            platform: windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            ext: ""
            platform: macos-arm64
    # Artifact upload needs actions: write. contents stays read-only here.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        run: |
          cargo test --manifest-path tools/combat-sim/Cargo.toml --target ${{ matrix.target }}
          cargo test --manifest-path tools/talkdnd/Cargo.toml --target ${{ matrix.target }}

      - name: Build release
        run: |
          cargo build --release --manifest-path tools/combat-sim/Cargo.toml --target ${{ matrix.target }}
          cargo build --release --manifest-path tools/talkdnd/Cargo.toml --target ${{ matrix.target }}

      - name: Package LetsPlay bundle
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          EXT: ${{ matrix.ext }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="dry"
          fi
          case "$tag" in
            ""|*[!A-Za-z0-9._+-]*)
              echo "unsupported package tag" >&2
              exit 1
              ;;
          esac
          for tool in combat-sim talkdnd; do
            if [ ! -f "tools/${tool}/target/${TARGET}/release/${tool}${EXT}" ]; then
              echo "release binary ${tool} not found" >&2
              exit 1
            fi
          done
          name="talkdnd-letsplay-${tag}-${PLATFORM}"
          rm -rf dist
          mkdir -p dist/stage dist/out
          # Only git-tracked files: never copy the working tree.
          git archive --format=tar HEAD LetsPlay | tar -xf - -C dist/stage
          cp NOTICE LICENSE dist/stage/LetsPlay/
          for tool in combat-sim talkdnd; do
            cp "tools/${tool}/target/${TARGET}/release/${tool}${EXT}" "dist/stage/LetsPlay/bin/${tool}${EXT}"
            chmod 755 "dist/stage/LetsPlay/bin/${tool}${EXT}"
          done
          # Shipped-file manifest: lets `talkdnd start` clean files this
          # version no longer ships. One `<sha256>  <path>` line per file,
          # paths relative to LetsPlay/.
          if command -v sha256sum >/dev/null 2>&1; then
            sha_file() { sha256sum "$1" | awk '{print $1}'; }
          elif command -v shasum >/dev/null 2>&1; then
            sha_file() { shasum -a 256 "$1" | awk '{print $1}'; }
          else
            echo "no sha256 tool available" >&2
            exit 1
          fi
          rm -f dist/stage/LetsPlay/.talkdnd-files.txt
          (cd dist/stage/LetsPlay && find . -type f ! -name '.talkdnd-files.txt' | LC_ALL=C sort | while IFS= read -r file; do
            printf '%s  %s\n' "$(sha_file "$file")" "${file#./}"
          done) > dist/stage/LetsPlay/.talkdnd-files.txt
          # The archive extracts to one self-contained folder named TalkDND/;
          # players may move or rename it (the tools find it from bin/..).
          mv dist/stage/LetsPlay dist/stage/TalkDND
          # Allowed list = tracked LetsPlay files + NOTICE + LICENSE + binaries
          # + the shipped-file manifest.
          { git ls-files -- LetsPlay | sed "s#^LetsPlay/#TalkDND/#"; echo TalkDND/NOTICE; echo TalkDND/LICENSE; echo "TalkDND/bin/combat-sim${EXT}"; echo "TalkDND/bin/talkdnd${EXT}"; echo TalkDND/.talkdnd-files.txt; } \
            | LC_ALL=C sort -u > dist/allowed.txt
          if [ "$ARCHIVE" = "zip" ]; then
            archive="dist/out/${name}.zip"
            (cd dist/stage && 7z a -tzip -bd -r "../out/${name}.zip" TalkDND >/dev/null)
            7z l -slt "$archive" | sed -n 's/^Path = //p' | tail -n +2 | tr '\\' '/' > dist/raw.txt
            7z l -slt "$archive" | awk '/^Path = /{p=substr($0,8)} /^Folder = -/{print p}' | tr '\\' '/' | LC_ALL=C sort -u > dist/listed.txt
          else
            archive="dist/out/${name}.tar.gz"
            COPYFILE_DISABLE=1 tar -czf "$archive" -C dist/stage TalkDND
            tar -tzf "$archive" > dist/raw.txt
            grep -v '/$' dist/raw.txt | LC_ALL=C sort -u > dist/listed.txt
          fi
          echo "archive entries: $(wc -l < dist/listed.txt)"
          # Privacy gate: exact match against the allowed list, then deny patterns.
          if ! diff -u dist/allowed.txt dist/listed.txt; then
            echo "archive contents differ from tracked LetsPlay list" >&2
            exit 1
          fi
          if grep -Eiq '\.pdf$|(^|/)dm-secrets\.md$' dist/raw.txt; then
            echo "archive contains a forbidden file" >&2
            exit 1
          fi
          if grep -E '^TalkDND/Saves/' dist/raw.txt | grep -Ev '^TalkDND/Saves/(README\.md)?$' | grep -q .; then
            echo "archive contains save content" >&2
            exit 1
          fi
          for d in Rules/2014 Rules/2024 Adventures; do
            if grep -E "^TalkDND/$d/" dist/raw.txt | grep -Ev "^TalkDND/$d/(README\.md)?\$" | grep -q .; then
              echo "archive contains player book content" >&2
              exit 1
            fi
          done
          # User-data areas must never ship: top-level rulings (the shipped
          # defaults live in Rules/defaults/), local/fixes/handout files and
          # tool state.
          if grep -E '^TalkDND/Rules/rulings[^/]*\.md$|^TalkDND/.*/local/|^TalkDND/.*/fixes/|^TalkDND/.*/handouts\.yaml$|^TalkDND/\.talkdnd/' dist/raw.txt; then
            echo "archive contains user-data files" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            hash=$(sha256sum "$archive" | awk '{print $1}')
          elif command -v shasum >/dev/null 2>&1; then
            hash=$(shasum -a 256 "$archive" | awk '{print $1}')
          else
            hash=$(powershell.exe -NoProfile -Command "(Get-FileHash -Algorithm SHA256 -LiteralPath '$archive').Hash.ToLower()")
          fi
          hash=$(printf '%s' "$hash" | tr -cd '0-9a-fA-F' | tr 'A-F' 'a-f')
          if ! printf '%s' "$hash" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "checksum failed" >&2
            exit 1
          fi
          printf '%s  %s\n' "$hash" "$(basename "$archive")" > "${archive}.sha256"

      - name: Smoke-test the package from a renamed folder
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          base="$(mktemp -d)"
          archives=("$PWD"/dist/out/*."$ARCHIVE")
          if [ "$ARCHIVE" = zip ]; then
            (cd "$base" && 7z x "${archives[0]}" >/dev/null)
          else
            tar -xzf "${archives[0]}" -C "$base"
          fi
          play="$base/我的 冒险 game"
          mv "$base/TalkDND" "$play"
          mkdir "$base/other directory"
          cd "$base/other directory"
          talk="$play/bin/talkdnd$EXT"
          cs="$play/bin/combat-sim$EXT"
          for edition in 2014 2024; do
            date=2030-01-01
            if [ "$edition" = 2024 ]; then date=2030-01-02; fi
            "$talk" new --ruleset "$edition" --date "$date" >/dev/null
            "$talk" chargen status >/dev/null
            "$talk" start --no-pdf2md >/dev/null
            save="$play/Saves/$date-01"
            campaign="$save/combat/campaign.yaml"
            fixture="$save/combat/smoke-fixture.yaml"
            cat > "$fixture" <<'EOF'
          creatures:
            - id: smoke-hero
              name: Smoke Hero
              kind: pc
              side: party
              hp: 40
              resources: {spell-slot-1: {max: 2, recharge: long}}
              actions: [{ref: shield}, {ref: mending}]
            - id: smoke-ally
              name: Smoke Ally
              kind: pc
              side: party
              hp: 40
            - id: smoke-caster
              name: Smoke Caster
              kind: monster
              side: enemy
              hp: 40
              resources: {spell-slot-1: {max: 2, recharge: long}}
              actions: [{ref: magic-missile}]
          EOF
            "$cs" --campaign "$campaign" roll 1d20+5 --seed 21 | grep '1d20'
            fight=(--campaign "$campaign" --lib "$fixture" --state smoke)
            "$cs" "${fight[@]}" quick --foe smoke-caster --party smoke-hero,smoke-ally >/dev/null
            "$cs" "${fight[@]}" init --set 'Smoke Caster=20' --set 'Smoke Hero=10' \
              --set 'Smoke Ally=5' >/dev/null
            "$cs" "${fight[@]}" cast 'Smoke Caster' magic-missile 'Smoke Hero' \
              'Smoke Hero' 'Smoke Ally' --seed 21 | grep 'can use Shield'
            state="$save/combat/smoke.state.json"
            cp "$state" "$base/pending.json"
            "$talk" start --no-pdf2md >/dev/null
            cmp "$base/pending.json" "$state"
            pending=$("$cs" "${fight[@]}" --player status --json)
            id=$(jq -er '.pending_reaction | select(.who == "Smoke Hero" and .reaction == "Shield") | .id' <<< "$pending")
            jq -e '[.combatants[].name] | index("Smoke Caster") == null' <<< "$pending" >/dev/null
            "$cs" "${fight[@]}" reaction "$id" take >/dev/null
            "$cs" "${fight[@]}" status --json | jq -e '
              .pending_reaction == null
              and any(.combatants[]; .name == "Smoke Hero" and .hp == 40 and .resources["spell-slot-1"].current == 1)
              and any(.combatants[]; .name == "Smoke Ally" and .hp >= 35 and .hp <= 38)
              and any(.combatants[]; .name == "Smoke Caster" and .resources["spell-slot-1"].current == 1)
            ' >/dev/null
            cp "$state" "$base/resolved.json"
            if "$cs" "${fight[@]}" reaction "$id" take >/dev/null 2>&1; then
              echo "A completed reaction was accepted again ($edition)" >&2
              exit 1
            fi
            cmp "$base/resolved.json" "$state"
            "$cs" "${fight[@]}" encounter status | grep -F 'open '
            "$cs" "${fight[@]}" encounter close --reason 'Smoke test complete'
            "$cs" "${fight[@]}" encounter status | grep -F 'closed '
            sed 's@^library: \[@library: [smoke-fixture.yaml, @' "$campaign" > "$base/casting-campaign.yaml"
            mv "$base/casting-campaign.yaml" "$campaign"
            casting_fight=(--campaign "$campaign" --state casting)
            "$cs" "${casting_fight[@]}" quick --foe smoke-caster --party smoke-hero,smoke-ally >/dev/null
            "$cs" "${casting_fight[@]}" init --set 'Smoke Hero=25' --set 'Smoke Caster=10' \
              --set 'Smoke Ally=5' >/dev/null
            "$talk" time enable >/dev/null
            "$talk" time casting start smoke-hero mending >/dev/null
            id=$("$talk" time casting status | awk '$2 == "smoke-hero" && $3 == "mending" { print $1 }')
            test -n "$id"
            "$talk" time advance --seconds 48 >/dev/null
            "$talk" time casting enter casting >/dev/null
            "$cs" "${casting_fight[@]}" long-cast continue "$id" >/dev/null
            "$talk" time casting leave >/dev/null
            grep -F 'elapsed_seconds: 54' "$save/world-time.yaml"
            "$talk" time advance --seconds 6 >/dev/null
            "$talk" time casting finish "$id" --confirm-manual >/dev/null
            "$talk" time casting status | grep -F completed
            grep -F 'elapsed_seconds: 60' "$save/world-time.yaml"
            grep -F "$id" "$save/combat/party-state.yaml"
            "$cs" "${casting_fight[@]}" encounter close --reason 'Smoke test complete'
            test -s "$save/rolls.log"
            test ! -e Saves
            echo "Packed $edition SRD smoke test passed"
          done

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: talkdnd-letsplay-${{ matrix.platform }}
          path: dist/out/
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # contents: write is granted only on this job. actions: read downloads
    # the packages produced above.
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Generate release notes
        run: cargo run --quiet --manifest-path tools/talkdnd-dev/Cargo.toml -- release-notes "${{ github.ref_name }}" > notes.md

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: talkdnd-letsplay-*
          merge-multiple: true

      # Full packs are built locally from the owner's books and are never
      # committed or downloaded. A hosted runner has no books, so this step
      # skips. A release runner that already has target/full-packs (for
      # example the owner's self-hosted runner) attaches one extra asset.
      - name: Stage local full packs (optional)
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G "target/full-packs/*.pack.json" > /dev/null; then
            echo "no local full packs in this workspace; skipping (CI never builds or downloads full packs)"
            exit 0
          fi
          cargo run --quiet --manifest-path tools/combat-sim/Cargo.toml -- \
            content pack release --packs target/full-packs --out dist/full-packs
          name="talkdnd-full-packs-${GITHUB_REF_NAME}"
          tar -czf "release-assets/${name}.tar.gz" -C dist/full-packs .
          if command -v sha256sum >/dev/null 2>&1; then
            hash=$(sha256sum "release-assets/${name}.tar.gz" | awk '{print $1}')
          else
            hash=$(shasum -a 256 "release-assets/${name}.tar.gz" | awk '{print $1}')
          fi
          printf '%s  %s\n' "$hash" "${name}.tar.gz" > "release-assets/${name}.tar.gz.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          body_path: notes.md
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.sha256
        env:
          GITHUB_TOKEN: ${{ github.token }}
