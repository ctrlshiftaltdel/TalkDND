name: release

# Tag pushes (v*) test, package, and publish a GitHub Release.
# workflow_dispatch is a dry build: it uploads Actions artifacts and does not
# create a Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            ext: ""
            platform: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            ext: .exe
            platform: windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            ext: ""
            platform: macos-arm64
    # Artifact upload needs actions: write. contents stays read-only here.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        run: |
          cargo test --manifest-path tools/combat-sim/Cargo.toml --target ${{ matrix.target }}
          cargo test --manifest-path tools/talkdnd/Cargo.toml --target ${{ matrix.target }}

      - name: Build release
        run: |
          cargo build --release --manifest-path tools/combat-sim/Cargo.toml --target ${{ matrix.target }}
          cargo build --release --manifest-path tools/talkdnd/Cargo.toml --target ${{ matrix.target }}

      - name: Package LetsPlay bundle
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          EXT: ${{ matrix.ext }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="dry"
          fi
          case "$tag" in
            ""|*[!A-Za-z0-9._+-]*)
              echo "unsupported package tag" >&2
              exit 1
              ;;
          esac
          for tool in combat-sim talkdnd; do
            if [ ! -f "tools/${tool}/target/${TARGET}/release/${tool}${EXT}" ]; then
              echo "release binary ${tool} not found" >&2
              exit 1
            fi
          done
          name="talkdnd-letsplay-${tag}-${PLATFORM}"
          rm -rf dist
          mkdir -p dist/stage dist/out
          # Only git-tracked files: never copy the working tree.
          git archive --format=tar HEAD LetsPlay | tar -xf - -C dist/stage
          cp NOTICE LICENSE dist/stage/LetsPlay/
          for tool in combat-sim talkdnd; do
            cp "tools/${tool}/target/${TARGET}/release/${tool}${EXT}" "dist/stage/LetsPlay/bin/${tool}${EXT}"
            chmod 755 "dist/stage/LetsPlay/bin/${tool}${EXT}"
          done
          # Shipped-file manifest: lets `talkdnd start` clean files this
          # version no longer ships. One `<sha256>  <path>` line per file,
          # paths relative to LetsPlay/.
          if command -v sha256sum >/dev/null 2>&1; then
            sha_file() { sha256sum "$1" | awk '{print $1}'; }
          elif command -v shasum >/dev/null 2>&1; then
            sha_file() { shasum -a 256 "$1" | awk '{print $1}'; }
          else
            echo "no sha256 tool available" >&2
            exit 1
          fi
          rm -f dist/stage/LetsPlay/.talkdnd-files.txt
          (cd dist/stage/LetsPlay && find . -type f ! -name '.talkdnd-files.txt' | LC_ALL=C sort | while IFS= read -r file; do
            printf '%s  %s\n' "$(sha_file "$file")" "${file#./}"
          done) > dist/stage/LetsPlay/.talkdnd-files.txt
          # The archive extracts to one self-contained folder named TalkDND/;
          # players may move or rename it (the tools find it from bin/..).
          mv dist/stage/LetsPlay dist/stage/TalkDND
          # Allowed list = tracked LetsPlay files + NOTICE + LICENSE + binaries
          # + the shipped-file manifest.
          { git ls-files -- LetsPlay | sed "s#^LetsPlay/#TalkDND/#"; echo TalkDND/NOTICE; echo TalkDND/LICENSE; echo "TalkDND/bin/combat-sim${EXT}"; echo "TalkDND/bin/talkdnd${EXT}"; echo TalkDND/.talkdnd-files.txt; } \
            | LC_ALL=C sort -u > dist/allowed.txt
          if [ "$ARCHIVE" = "zip" ]; then
            archive="dist/out/${name}.zip"
            (cd dist/stage && 7z a -tzip -bd -r "../out/${name}.zip" TalkDND >/dev/null)
            7z l -slt "$archive" | sed -n 's/^Path = //p' | tail -n +2 | tr '\\' '/' > dist/raw.txt
            7z l -slt "$archive" | awk '/^Path = /{p=substr($0,8)} /^Folder = -/{print p}' | tr '\\' '/' | LC_ALL=C sort -u > dist/listed.txt
          else
            archive="dist/out/${name}.tar.gz"
            COPYFILE_DISABLE=1 tar -czf "$archive" -C dist/stage TalkDND
            tar -tzf "$archive" > dist/raw.txt
            grep -v '/$' dist/raw.txt | LC_ALL=C sort -u > dist/listed.txt
          fi
          echo "archive entries: $(wc -l < dist/listed.txt)"
          # Privacy gate: exact match against the allowed list, then deny patterns.
          if ! diff -u dist/allowed.txt dist/listed.txt; then
            echo "archive contents differ from tracked LetsPlay list" >&2
            exit 1
          fi
          if grep -Eiq '\.pdf$|(^|/)dm-secrets\.md$' dist/raw.txt; then
            echo "archive contains a forbidden file" >&2
            exit 1
          fi
          if grep -E '^TalkDND/Saves/' dist/raw.txt | grep -Ev '^TalkDND/Saves/(README\.md)?$' | grep -q .; then
            echo "archive contains save content" >&2
            exit 1
          fi
          for d in Rules/2014 Rules/2024 Adventures; do
            if grep -E "^TalkDND/$d/" dist/raw.txt | grep -Ev "^TalkDND/$d/(README\.md)?\$" | grep -q .; then
              echo "archive contains player book content" >&2
              exit 1
            fi
          done
          # User-data areas must never ship: top-level rulings (the shipped
          # defaults live in Rules/defaults/), local/fixes/handout files and
          # tool state.
          if grep -E '^TalkDND/Rules/rulings[^/]*\.md$|^TalkDND/.*/local/|^TalkDND/.*/fixes/|^TalkDND/.*/handouts\.yaml$|^TalkDND/\.talkdnd/' dist/raw.txt; then
            echo "archive contains user-data files" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            hash=$(sha256sum "$archive" | awk '{print $1}')
          elif command -v shasum >/dev/null 2>&1; then
            hash=$(shasum -a 256 "$archive" | awk '{print $1}')
          else
            hash=$(powershell.exe -NoProfile -Command "(Get-FileHash -Algorithm SHA256 -LiteralPath '$archive').Hash.ToLower()")
          fi
          hash=$(printf '%s' "$hash" | tr -cd '0-9a-fA-F' | tr 'A-F' 'a-f')
          if ! printf '%s' "$hash" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "checksum failed" >&2
            exit 1
          fi
          printf '%s  %s\n' "$hash" "$(basename "$archive")" > "${archive}.sha256"

      - name: Smoke-test the package from a renamed folder
        if: matrix.archive != 'zip'
        shell: bash
        run: |
          set -euo pipefail
          base="$(mktemp -d)"
          tar -xzf dist/out/*.tar.gz -C "$base"
          play="$base/我的 冒险 game"
          mv "$base/TalkDND" "$play"
          elsewhere="$(mktemp -d)"
          cd "$elsewhere"
          "$play/bin/talkdnd" new --ruleset 2014 --date 2030-01-01
          "$play/bin/talkdnd" chargen status
          "$play/bin/talkdnd" start --no-pdf2md
          "$play/bin/combat-sim" roll 1d20+5
          test -d "$play/Saves/2030-01-01-01"
          test ! -e "$elsewhere/Saves"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: talkdnd-letsplay-${{ matrix.platform }}
          path: dist/out/
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # contents: write is granted only on this job. actions: read downloads
    # the packages produced above.
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Generate release notes
        run: cargo run --quiet --manifest-path tools/talkdnd-dev/Cargo.toml -- release-notes "${{ github.ref_name }}" > notes.md

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: talkdnd-letsplay-*
          merge-multiple: true

      # Full packs are built locally from the owner's books and are never
      # committed or downloaded. A hosted runner has no books, so this step
      # skips. A release runner that already has target/full-packs (for
      # example the owner's self-hosted runner) attaches one extra asset.
      - name: Stage local full packs (optional)
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G "target/full-packs/*.pack.json" > /dev/null; then
            echo "no local full packs in this workspace; skipping (CI never builds or downloads full packs)"
            exit 0
          fi
          cargo run --quiet --manifest-path tools/combat-sim/Cargo.toml -- \
            content pack release --packs target/full-packs --out dist/full-packs
          name="talkdnd-full-packs-${GITHUB_REF_NAME}"
          tar -czf "release-assets/${name}.tar.gz" -C dist/full-packs .
          if command -v sha256sum >/dev/null 2>&1; then
            hash=$(sha256sum "release-assets/${name}.tar.gz" | awk '{print $1}')
          else
            hash=$(shasum -a 256 "release-assets/${name}.tar.gz" | awk '{print $1}')
          fi
          printf '%s  %s\n' "$hash" "${name}.tar.gz" > "release-assets/${name}.tar.gz.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          body_path: notes.md
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.sha256
        env:
          GITHUB_TOKEN: ${{ github.token }}
