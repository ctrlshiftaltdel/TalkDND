name: release

# Tag pushes (v*) test, package, and publish a GitHub Release.
# workflow_dispatch is a dry build: it uploads Actions artifacts and does not
# create a Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            bin_name: combat-sim
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            bin_name: combat-sim.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            bin_name: combat-sim
    # Artifact upload needs actions: write. contents stays read-only here.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        run: cargo test --manifest-path tools/combat-sim/Cargo.toml --target ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --manifest-path tools/combat-sim/Cargo.toml --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          BIN_NAME: ${{ matrix.bin_name }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="dry"
          fi
          case "$tag" in
            ""|*[!A-Za-z0-9._+-]*)
              echo "unsupported package tag" >&2
              exit 1
              ;;
          esac
          bin="tools/combat-sim/target/${TARGET}/release/${BIN_NAME}"
          if [ ! -f "$bin" ]; then
            echo "release binary not found" >&2
            exit 1
          fi
          name="combat-sim-${tag}-${TARGET}"
          rm -rf dist
          mkdir -p "dist/stage/${name}" dist/out
          cp "$bin" "dist/stage/${name}/"
          cp README.md LICENSE NOTICE "dist/stage/${name}/"
          if [ "$ARCHIVE" = "zip" ]; then
            archive="dist/out/${name}.zip"
            powershell.exe -NoProfile -Command "Compress-Archive -Path 'dist/stage/${name}' -DestinationPath '${archive}' -Force"
          else
            archive="dist/out/${name}.tar.gz"
            COPYFILE_DISABLE=1 tar -czf "$archive" -C dist/stage "$name"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            hash=$(sha256sum "$archive" | awk '{print $1}')
          elif command -v shasum >/dev/null 2>&1; then
            hash=$(shasum -a 256 "$archive" | awk '{print $1}')
          else
            hash=$(powershell.exe -NoProfile -Command "(Get-FileHash -Algorithm SHA256 -LiteralPath '$archive').Hash.ToLower()")
          fi
          hash=$(printf '%s' "$hash" | tr -cd '0-9a-fA-F' | tr 'A-F' 'a-f')
          if ! printf '%s' "$hash" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "checksum failed" >&2
            exit 1
          fi
          printf '%s  %s\n' "$hash" "$(basename "$archive")" > "${archive}.sha256"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: combat-sim-${{ matrix.target }}
          path: dist/out/
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # contents: write is granted only on this job. actions: read downloads
    # the packages produced above.
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: combat-sim-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          body: |
            Prebuilt combat-sim binaries for ${{ github.ref_name }}.

            - Linux x86_64: `combat-sim-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz`
            - Windows x86_64: `combat-sim-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip`
            - macOS Apple Silicon: `combat-sim-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz`

            Each archive contains the binary plus README.md, LICENSE, and NOTICE.
            The matching `.sha256` file checksums that archive. macOS Intel builds
            are not published. Put the binary in `tools/bin/` as described in the README.
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.sha256
        env:
          GITHUB_TOKEN: ${{ github.token }}
