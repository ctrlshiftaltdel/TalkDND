# PHB 2024 Appendix C (Rules Glossary). Only mechanical parts the engine can apply are encoded;
# the rest is in `manual`.
conditions:
  - id: blinded
    modifiers:
      - {applies: attack_roll, effect: disadvantage}
      - {applies: incoming_attack, effect: advantage}
    manual: "Can't see; automatically fails checks that require sight."
  - id: charmed
    manual: "Can't attack the charmer or target it with damaging abilities; charmer has advantage on social checks."
  - id: deafened
    manual: "Can't hear; automatically fails checks that require hearing."
  - id: exhaustion
    manual: "2024: each level -2 to d20 Tests and -5 ft speed; level 6 = death. Track level manually."
  - id: frightened
    modifiers:
      - {applies: attack_roll, effect: disadvantage}
      - {applies: check, effect: disadvantage}
    manual: "Disadvantage only while the source of fear is in line of sight; can't willingly move closer to it."
  - id: grappled
    flags: [speed_zero]
    modifiers:
      - {applies: attack_roll, effect: disadvantage, when: {not: {linked_is_target: true}}}
    manual: "Grappler can drag/carry it (speed halved). Escape: action, Athletics/Acrobatics vs escape DC."
  - id: incapacitated
    flags: [incapacitated]
    manual: "No actions, bonus actions or reactions; concentration ends; can't speak; disadvantage on initiative."
  - id: invisible
    modifiers:
      - {applies: attack_roll, effect: advantage}
      - {applies: incoming_attack, effect: disadvantage}
  - id: paralyzed
    implies: [incapacitated]
    flags: [speed_zero]
    modifiers:
      - {applies: save, effect: auto_fail, filter: {ability: [str, dex]}}
      - {applies: incoming_attack, effect: advantage}
      - {applies: incoming_attack, effect: auto_crit, when: {attacker_within: 5}}
  - id: petrified
    implies: [incapacitated]
    flags: [speed_zero]
    modifiers:
      - {applies: save, effect: auto_fail, filter: {ability: [str, dex]}}
      - {applies: incoming_attack, effect: advantage}
      - {applies: damage_taken, effect: resistance}
    manual: "Immune to poison damage and the poisoned condition while petrified."
  - id: poisoned
    modifiers:
      - {applies: attack_roll, effect: disadvantage}
      - {applies: check, effect: disadvantage}
  - id: prone
    flags: [stand_up_half_speed]
    modifiers:
      - {applies: attack_roll, effect: disadvantage}
      - {applies: incoming_attack, effect: advantage, when: {attacker_within: 5}}
      - {applies: incoming_attack, effect: disadvantage, when: {attacker_beyond: 5}}
  - id: restrained
    flags: [speed_zero]
    modifiers:
      - {applies: attack_roll, effect: disadvantage}
      - {applies: incoming_attack, effect: advantage}
      - {applies: save, effect: disadvantage, filter: {ability: [dex]}}
  - id: stunned
    implies: [incapacitated]
    modifiers:
      - {applies: save, effect: auto_fail, filter: {ability: [str, dex]}}
      - {applies: incoming_attack, effect: advantage}
  - id: unconscious
    implies: [incapacitated, prone]
    flags: [speed_zero]
    modifiers:
      - {applies: save, effect: auto_fail, filter: {ability: [str, dex]}}
      - {applies: incoming_attack, effect: advantage}
      - {applies: incoming_attack, effect: auto_crit, when: {attacker_within: 5}}
  # --- helper conditions used by basic actions, masteries and spells ---
  - id: dodging
    modifiers:
      - {applies: incoming_attack, effect: disadvantage}
      - {applies: save, effect: advantage, filter: {ability: [dex]}}
    manual: "Lost if incapacitated or speed is 0. Lasts until the start of your next turn."
  - id: disengaged
    flags: [no_opportunity_attacks_against]
    manual: "Movement doesn't provoke Opportunity Attacks for the rest of the turn."
  - id: hidden
    modifiers:
      - {applies: attack_roll, effect: advantage}
      - {applies: incoming_attack, effect: disadvantage}
    duration_default: {until: end_of_target_next_turn}
    ends_on: [own_attack]
    manual: "2024 Hide: DC 15 Stealth check, needs cover/obscurement; ends when you attack, make noise, or are found."
  - id: helped
    modifiers:
      - {applies: attack_roll, effect: advantage, consume: true}
    manual: "Help: advantage on next attack vs that enemy (or next check) before your next turn."
  - id: concentrating
    manual: "Concentrating on a spell; CON save DC max(10, half damage) when damaged."
  - id: sapped
    modifiers:
      - {applies: attack_roll, effect: disadvantage, consume: true}
  - id: slowed
    modifiers:
      - {applies: speed, effect: bonus, value: -10}
  - id: vexed
    modifiers:
      - {applies: incoming_attack, effect: advantage, when: {linked_is_attacker: true}, consume: true}
  - id: no-opportunity-attacks
    flags: [no_opportunity_attacks]
  - id: shielded
    modifiers:
      - {applies: ac, effect: bonus, value: 5}
      - {applies: damage_taken, effect: immunity, filter: {tags: [magic-missile]}}
  - id: blessed
    modifiers:
      - {applies: attack_roll, effect: bonus, value: "1d4"}
      - {applies: save, effect: bonus, value: "1d4"}
  - id: sanctuary-warded
    ends_on: [own_attack, own_spell, deals_damage]
    manual: "Attackers targeting this creature with an attack roll or damaging spell must make a WIS save vs the caster's DC or choose a new target / lose the attack. Resolve with `save <attacker> wis <dc>`."
  - id: net-restrained
    implies: [restrained]
    manual: "Weighted net: action + DC 10 STR check frees self or a creature within reach; net AC 10, 12 HP."
  # Not an official condition: TalkDND bookkeeping marker. 2024 PHB: carrying,
  # dragging or pushing a creature/heavy load halves Speed (see Rules/rulings.md).
  - id: carrying
    flags: [speed_halved]
    manual: "Carrying/dragging a creature: Speed halved. Remove when the load is put down."
